[package]
name = "aify-mcp"
version = "0.1.0"
edition = "2021"
description = "AIfy MCP bridge — Rust implementation"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
